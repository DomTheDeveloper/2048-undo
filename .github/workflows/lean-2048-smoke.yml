name: Lean 2048 kernel smoke tests
on:
  push:
    branches: [proof/lean-131072]
    paths: ["lean/**", ".github/workflows/lean-2048-smoke.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-2048-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: lean2048-toolchain-v4.19.0
      - name: Install pinned Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the semantics and representative witness moves
        shell: bash
        run: |
          set -euo pipefail
          cd lean
          export LEAN_PATH="$PWD"
          lean -o Game2048/Basic.olean Game2048/Basic.lean
          lean -o Game2048/LowerBound.olean Game2048/LowerBound.lean
          python3 - <<'PY'
          import build_certificate as m
          from pathlib import Path
          starts, moves = m.parse_witness()
          b = [0]*16
          for r,c,v in starts:
              b[4*r+c] = v
          cases = {0, 1, 127, 1023, 16383, 32765, 32780}
          src = 'import Game2048.Basic\nopen Game2048\nset_option maxRecDepth 100000\nset_option maxHeartbeats 0\n'
          for i,s in enumerate(moves):
              d,r,c,v = s
              before = b.copy()
              b,_ = m.slide(b,d)
              b[4*r+c] = v
              if i in cases:
                  src += f'def before{i} : Board := {m.board_literal(before)}\n'
                  src += f'def after{i} : Board := {m.board_literal(b)}\n'
                  src += f'theorem move{i} : step before{i} {m.step_literal(s)} = some after{i} := by decide +kernel\n'
                  src += f'theorem legal{i} : Plays before{i} 1 after{i} := Plays.snoc Plays.refl {m.step_literal(s)} move{i}\n'
                  src += f'#print axioms legal{i}\n'
          Path('Smoke.lean').write_text(src, encoding='utf-8')
          PY
          /usr/bin/time -v lean Smoke.lean 2>&1 | tee smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean2048-smoke
          path: |
            lean/Smoke.lean
            lean/smoke.log
