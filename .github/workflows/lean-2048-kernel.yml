name: Independent Lean 2048 full kernel proof
on:
  push:
    branches: [proof/lean-131072]
    paths: ["lean-kernel/**", "witness/131072.txt", ".github/workflows/lean-2048-kernel.yml"]
  pull_request:
    paths: ["lean-kernel/**", "witness/131072.txt", ".github/workflows/lean-2048-kernel.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-2048-kernel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: lean2048-toolchain-v4.19.0
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Rebuild all proofs and audit the final theorem
        run: bash lean-kernel/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-lean2048-full-kernel-proof
          path: |
            lean-kernel/Game2048/**/*.lean
            lean-kernel/*.py
            lean-kernel/*.sh
            lean-kernel/*.md
            lean-kernel/*.log
            lean-kernel/lean-toolchain
            lean-kernel/verification.json
            witness/131072.txt
          if-no-files-found: error
