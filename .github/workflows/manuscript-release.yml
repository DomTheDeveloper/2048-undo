name: Finalize Dominic Dabish 2048 manuscript
on:
  push:
    branches: ['claude/super-mode-speed-corners-doxfcj']
    paths: ['paper/**', 'CITATION.*', '.github/workflows/manuscript-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: manuscript-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  finalize:
    if: github.ref == 'refs/heads/claude/super-mode-speed-corners-doxfcj' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply reviewed editorial changes without overwriting newer work
        shell: bash
        run: |
          set -euo pipefail
          python3 paper/finalize.py apply
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          p.write_text(p.read_text().replace('**Dominic Dabish — San Diego State University**  \n', '**Dominic Dabish — San Diego State University**\n'))
          PY
      - name: Install isolated pinned Lean 4.19.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lean419"
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst --output "$RUNNER_TEMP/lean419.tar.zst"
          tar --use-compress-program=unzstd -xf "$RUNNER_TEMP/lean419.tar.zst" -C "$RUNNER_TEMP/lean419" --strip-components=1
          "$RUNNER_TEMP/lean419/bin/lean" --version
          echo "$RUNNER_TEMP/lean419/bin" >> "$GITHUB_PATH"
      - name: Rebuild every claimed Lean theorem and replay all finite constructions
        shell: bash
        run: |
          set -euo pipefail
          find lean-kernel -name '*.olean' -delete
          mkdir -p research/audit/release
          sha256sum "$RUNNER_TEMP/lean419.tar.zst" > research/audit/release/toolchain-download.sha256
          bash research/finish.sh full 2>&1 | tee research/audit/release/full-kernel.log
          git diff --exit-code -- js witness lean-kernel/Game2048
      - name: Fresh full state-space verification
        run: bash research/state-space/run.sh --large --output-dir "$RUNNER_TEMP/state-space-final"
      - name: Install typesetting tools and rebuild final PDF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-pictures texlive-fonts-recommended poppler-utils
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export FORCE_SOURCE_DATE=1
          bash paper/build.sh 2>&1 | tee research/audit/release/paper-build.log
      - name: Bind the release receipt to the completed checks
        shell: bash
        env:
          STATE_SPACE_RUN: ${{ runner.temp }}/state-space-final
        run: python3 paper/finalize.py record
      - name: Commit verified author metadata, manuscript, PDF and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Dominic Dabish'
          git config user.email 'ddabish@sdsu.edu'
          git add README.md lean-kernel/README.md paper/main.tex paper/refs.bib paper/main.pdf paper/release.json research/audit/
          git diff --cached --check
          git commit -m 'Finalize Dominic Dabish SDSU manuscript with fresh all-opening kernel audit and rebuilt PDF'
          git push origin HEAD:claude/super-mode-speed-corners-doxfcj
          git rev-parse HEAD > publication/publication-commit.txt
          git archive --format=zip --output=publication/Perfect-2048-Source-and-Evidence.zip HEAD paper lean-kernel research witness verify test js README.md STATE_SPACE.md CITATION.cff CITATION.bib LICENSE.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Dominic-Dabish-2048-final-${{ github.run_id }}
          path: |
            publication/
            paper/main.log
            research/audit/
            lean-kernel/*.log
            lean-kernel/verification.json
            lean-kernel/Game2048/Generated/*.lean
            ${{ runner.temp }}/state-space-final/
          if-no-files-found: error
          retention-days: 90
