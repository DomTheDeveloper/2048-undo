name: Lean kernel workbench runtime
on:
  push:
    branches: [proof/lean-131072]
    paths: [.github/workflows/lean-kernel-workbench.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ~/.elan
          key: lean2048-toolchain-v4.19.0
      - name: Prepare pinned runtime
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          fi
          "$HOME/.elan/bin/lean" +leanprover/lean4:v4.19.0 --version
          ROOT="$HOME/.elan/toolchains/leanprover--lean4---v4.19.0"
          tar --exclude='*.a' --exclude='*.c' --exclude='*.ilean' -czf lean-4.19.0-runtime.tar.gz -C "$ROOT" bin lib
          ls -lh lean-4.19.0-runtime.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: lean-4.19.0-runtime
          path: lean-4.19.0-runtime.tar.gz
          compression-level: 0
          retention-days: 1
