name: Lean 2048 kernel audit

on:
  push:
    branches: [proof/lean-131072]
    paths: ["lean/**", "witness/**", ".github/workflows/lean-2048.yml"]
  pull_request:
    paths: ["lean/**", "witness/**", ".github/workflows/lean-2048.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-2048-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: lean-cache
        with:
          path: ~/.elan
          key: lean2048-toolchain-v4.19.0
      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.19.0
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - uses: actions/cache/save@v4
        if: steps.lean-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.elan
          key: lean2048-toolchain-v4.19.0
      - name: Compile proofs and check certificate in the kernel
        shell: bash
        run: |
          set -euo pipefail
          cd lean
          export LEAN_PATH="$PWD"
          lean --version | tee toolchain.log
          lean -o Game2048/Basic.olean Game2048/Basic.lean 2>&1 | tee basic.log
          if [ -f Game2048/LowerBound.lean ]; then
            lean -o Game2048/LowerBound.olean Game2048/LowerBound.lean 2>&1 | tee lower-bound.log
          fi
          if [ -f build_certificate.py ]; then
            python3 build_certificate.py 2>&1 | tee certificate-build.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean2048-kernel-audit
          path: |
            lean/*.log
            lean/Game2048/**/*.lean
            lean/Game2048/*.lean
            lean/*.py
          if-no-files-found: warn
