name: Publish checked extremal research
on:
  push:
    branches: [research/extremal-deductions]
    paths: [".research-bootstrap/**", ".github/workflows/extremal-publication.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: extremal-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/research/extremal-deductions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/extremal-deductions
      - name: Install the exact locally reviewed source bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ -d .research-bootstrap ]; then
            cat .research-bootstrap/0{0,1,2,3,4}.part > /tmp/research-source.tar.xz
            echo '1e279ad095a3a7e742c25d52073346b692c19549f418a1d4fbe340f9526df05a  /tmp/research-source.tar.xz' | sha256sum -c
            python3 - <<'PY'
          import tarfile
          with tarfile.open('/tmp/research-source.tar.xz') as t:
              t.extractall('.', filter='data')
          PY
            git apply --check research/manuscript.patch
            git apply research/manuscript.patch
            rm -rf .research-bootstrap
          fi
      - name: Reproduce finite calculations and independently replay new witnesses
        shell: bash
        run: |
          set -euo pipefail
          bash research/check.sh --computations-only | tee /tmp/research-computations.log
          python3 research/emit_opening_proofs.py
      - name: Match generated and handwritten Lean source to the completed local audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          report = json.loads(Path('research/audit/local-verification.json').read_text())
          assert report['kernel_checked'] is True
          assert report['labeled_openings'] == 480
          assert report['minimum_endpoint_mass'] == 131102
          for name, digest in report['source_sha256'].items():
              actual = hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual == digest, (name, actual, digest)
          print('The regenerated inputs match the completed local Lean audit exactly.')
          print('This publication job does not claim to have performed a new Lean kernel rebuild.')
          PY
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-pictures texlive-fonts-recommended poppler-utils
      - name: Rebuild the expanded manuscript
        shell: bash
        run: |
          set -euo pipefail
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex | tee /tmp/research-paper-build.log
          if grep -E 'undefined references|Citation .* undefined|Reference .* undefined|Overfull \\hbox' main.log; then
            echo 'Unresolved references or overflowing manuscript text.' >&2
            exit 1
          fi
          pdfinfo main.pdf
      - name: Commit the actual sources, reports, and rebuilt paper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/ README.md paper/main.tex paper/lean.tex paper/deductions.tex paper/main.pdf
          git add lean-kernel/Game2048/Symmetry.lean lean-kernel/Game2048/ResidualMass.lean lean-kernel/Game2048/MinimumMass.lean
          git add lean-kernel/Game2048/OpeningTails.lean lean-kernel/Game2048/OpeningCases.lean lean-kernel/Game2048/AllOpenings.lean
          git add witness/131072-minimum-fold-fours.txt witness/131072-fold-4.txt witness/131072-one-four.txt witness/full-chain-opposite.txt
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'Add checked all-opening optima, mass gateways, restricted score extrema, and new full-chain endings'
            git push origin HEAD:research/extremal-deductions
          fi
          mkdir -p publication
          git rev-parse HEAD > publication/source-commit.txt
          git archive --format=zip --output=publication/2048-expanded-research-source.zip HEAD
          cp paper/main.pdf publication/Perfect-2048-Expanded.pdf
          cp /tmp/research-computations.log /tmp/research-paper-build.log publication/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extremal-research-publication
          path: |
            publication/
            research/audit/
            research/results/
            paper/main.log
          if-no-files-found: error
