name: Build and publish the Lean-integrated paper
on:
  push:
    branches: [proof/lean-131072]
    paths: ["paper/**", "README.md", ".github/workflows/paper-build.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: paper-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paper:
    if: github.ref == 'refs/heads/proof/lean-131072'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: proof/lean-131072
      - name: Apply reviewed manuscript changes
        shell: bash
        run: |
          set -euo pipefail
          if [ -f paper/lean-integration.patch ]; then
            python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          expected = {
              'paper/main.tex': 'd6386a791e886412e189d4c2a5c2b035ee3941589d5223b7c84ae45113eab7bd',
              'paper/refs.bib': 'aa6b1e2d9e4438914b63dab695395e6d1abbbaa37210374cc57390fe259c3205',
              'README.md': 'a16fa2873d964ff935545810e6bf4f7ffcc10165e31a6d1a32199bc6442be71b',
          }
          for name, digest in expected.items():
              if sha256(Path(name).read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'Refusing to overwrite concurrently changed source: {name}')
          PY
            git apply --check paper/lean-integration.patch
            git apply paper/lean-integration.patch
            rm paper/lean-integration.patch
          fi
      - name: Preserve the successful kernel audit permanently
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p lean-kernel/audit
          audit=lean-kernel/audit/full-kernel-audit-03ca3d1.zip
          if [ ! -f "$audit" ]; then
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/DomTheDeveloper/2048-undo/actions/artifacts/10008288267/zip \
              --output "$audit"
          fi
          echo "a413d4f41526cf652912b757d0ea5da9f824004edeac3458a6e33b4d281d8aee  $audit" | sha256sum --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile('lean-kernel/audit/full-kernel-audit-03ca3d1.zip') as z:
              sources = list(Path('lean-kernel/Game2048').glob('*.lean'))
              sources += [Path('lean-kernel/build_certificate.py'), Path('lean-kernel/lean-toolchain'), Path('witness/131072.txt')]
              for p in sources:
                  if p.read_bytes() != z.read(p.as_posix()):
                      raise SystemExit(f'Current source differs from the completed kernel audit: {p}')
              report = json.loads(z.read('lean-kernel/verification.json'))
              assert report['kernel_checked'] is True
              assert report['moves'] == 32781 and report['two_twos_minimum_moves'] == 32782
              report.update(verified_commit='03ca3d181640a2c2a7685efc3ead4ff932d925e4',
                            github_actions_run=34094095435, github_actions_artifact=10008288267)
              Path('lean-kernel/audit/ci-34094095435.json').write_text(json.dumps(report, indent=2)+'\n')
              logs = z.read('lean-kernel/kernel-Main.log') + z.read('lean-kernel/kernel-Corollaries.log')
              Path('lean-kernel/audit/axioms-34094095435.txt').write_bytes(logs)
          print('Both completed Lean optima verified against the exact archived source bytes.')
          PY
      - name: Derive and independently check the two-2s witness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          rows = [x for x in Path('witness/131072.txt').read_text().splitlines()
                  if x.strip() and not x.lstrip().startswith('#')]
          assert rows[:2] == ['start 3 2 4', 'start 3 3 4']
          assert len(rows[2:]) == 32781
          header = ('# Standard 4x4 2048: shortest 131072 witness with two initial 2s.\n'
                    '# One right-slide / 4-spawn prepended to witness/131072.txt.\n'
                    '# Exactly 32782 rounds. See Game2048.standard2048_two_twos_exact.\n'
                    'start 3 2 2\nstart 3 3 2\nR 3 2 4\n')
          Path('witness/131072-two-twos.txt').write_text(header+'\n'.join(rows[2:])+'\n')
          PY
          python3 verify/verify2048.py witness/131072-two-twos.txt | tee /tmp/two-twos-python.log
          node test/replay_engine.js witness/131072-two-twos.txt | tee /tmp/two-twos-engine.log
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-pictures texlive-fonts-recommended poppler-utils
      - name: Build and validate the revised PDF
        shell: bash
        run: |
          set -euo pipefail
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex | tee /tmp/paper-build.log
          if grep -E 'undefined references|Citation .* undefined|Reference .* undefined|Overfull \\hbox' main.log; then
            echo 'Paper has unresolved references or overflowing text.' >&2
            exit 1
          fi
          pdfinfo main.pdf | tee /tmp/paper-pdfinfo.txt
          pdftotext main.pdf /tmp/paper-text.txt
          grep -q 'Kernel-checked reachability and optimality in Lean' /tmp/paper-text.txt
          grep -q '32,782' /tmp/paper-text.txt
      - name: Commit the manuscript, PDF, witness, and permanent audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md paper/main.tex paper/refs.bib paper/lean.tex paper/main.pdf witness/131072-two-twos.txt lean-kernel/audit/
          git add -u -- paper/
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate both Lean-certified 131072 optima into the paper and publish the rebuilt PDF'
            git push origin HEAD:proof/lean-131072
          fi
          mkdir -p publication
          git rev-parse HEAD > publication/source-commit.txt
          git archive --format=zip --output=publication/2048-paper-and-lean-source.zip HEAD
          cp paper/main.pdf publication/Perfect-2048-Lean.pdf
          cp /tmp/paper-build.log /tmp/paper-pdfinfo.txt /tmp/two-twos-python.log /tmp/two-twos-engine.log publication/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-integrated-paper-publication
          path: |
            publication/
            paper/main.log
          if-no-files-found: error
