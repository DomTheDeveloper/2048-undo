name: Extremal research publication
on:
  push:
    branches: [research/extremal-deductions]
    paths: [".github/workflows/extremal-package.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/extremal-deductions
      - name: Recover the exact locally audited research sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, subprocess, tarfile, urllib.request
          shas = ['b2eef0e0b69f0f26728e326689e09333472ecd87',
                  '20f9801e8a3f1bad6c69d2b36774caca6674cf20',
                  'd3e07bd98b968bb1abefc2a9c0c0014d709b6261',
                  '72e9d30cf6395b0500d3b4e872bfc61c847bfacd',
                  'a76e6dba11b32fea1de7ab611ecd42c0d285e750']
          parts = []
          for sha in shas:
              req = urllib.request.Request(
                  'https://api.github.com/repos/DomTheDeveloper/2048-undo/git/blobs/' + sha,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as f:
                  obj = json.load(f)
              parts.append(base64.b64decode(obj['content']))
          raw = b''.join(parts)
          assert hashlib.sha256(raw).hexdigest() == '1e279ad095a3a7e742c25d52073346b692c19549f418a1d4fbe340f9526df05a'
          if not pathlib.Path('research/DEDUCTIONS.md').exists():
              with tarfile.open(fileobj=io.BytesIO(raw)) as t:
                  t.extractall('.', filter='data')
              subprocess.run(['git', 'apply', '--check', 'research/manuscript.patch'], check=True)
              subprocess.run(['git', 'apply', 'research/manuscript.patch'], check=True)
          print('Exact research sources installed; existing concurrent files were not overwritten.')
          PY
      - name: Reproduce the finite results and independent witness checks
        run: |
          set -euo pipefail
          bash research/check.sh --computations-only | tee /tmp/research-computations.log
          python3 research/emit_opening_proofs.py
      - name: Check correspondence to the completed local Lean audit
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          report = json.loads(Path('research/audit/local-verification.json').read_text())
          checked = []
          def visit(obj):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if isinstance(value, str) and len(value) == 64 and key.endswith('.lean'):
                          p = Path(key)
                          if not p.exists(): p = Path('lean-kernel') / key
                          assert p.exists(), key
                          assert hashlib.sha256(p.read_bytes()).hexdigest() == value, key
                          checked.append(key)
                      else: visit(value)
              elif isinstance(obj, list):
                  for value in obj: visit(value)
          visit(report)
          assert len(checked) >= 6, checked
          print('Matched', len(checked), 'Lean sources to the completed local audit.')
          print('This is a publication/reproduction job, not a claim of a new CI kernel rebuild.')
          PY
      - name: Install LaTeX and rebuild the manuscript
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-pictures texlive-fonts-recommended poppler-utils
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex | tee /tmp/research-paper-build.log
          if grep -E 'undefined references|Citation .* undefined|Reference .* undefined|Overfull \\hbox' main.log; then exit 1; fi
          pdfinfo main.pdf
      - name: Commit reviewable sources and reports
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf .research-bootstrap
          rm -f .github/workflows/research-snapshot.yml .github/workflows/extremal-publication.yml
          git add research/ README.md paper/main.tex paper/lean.tex paper/deductions.tex paper/main.pdf
          git add lean-kernel/Game2048/Symmetry.lean lean-kernel/Game2048/ResidualMass.lean lean-kernel/Game2048/MinimumMass.lean
          git add lean-kernel/Game2048/OpeningTails.lean lean-kernel/Game2048/OpeningCases.lean lean-kernel/Game2048/AllOpenings.lean
          git add witness/131072-minimum-fold-fours.txt witness/131072-fold-4.txt witness/131072-one-four.txt witness/full-chain-opposite.txt
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'Publish all-opening Lean optima, gateway bounds, restricted score optima, and non-snake endings'
            git push origin HEAD:research/extremal-deductions
          fi
          mkdir -p publication
          git rev-parse HEAD > publication/source-commit.txt
          git archive --format=zip --output=publication/2048-expanded-research-source.zip HEAD
          cp paper/main.pdf publication/Perfect-2048-Expanded.pdf
          cp /tmp/research-computations.log /tmp/research-paper-build.log publication/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extremal-research-publication
          path: |
            publication/
            research/audit/
            research/results/
            paper/main.log
          if-no-files-found: error
