name: Monotone theorem and paper integration
on:
  push:
    branches:
      - research/monotone-official-integration
      - claude/super-mode-speed-corners-doxfcj
    paths:
      - 'paper/*.tex'
      - 'paper/*.bib'
      - 'research/monotone/**'
      - '.github/workflows/monotone-integration.yml'
  pull_request:
    branches: [claude/super-mode-speed-corners-doxfcj]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax and constructive checks
        run: |
          set -euo pipefail
          python3 -m py_compile research/monotone/*.py
          python3 research/monotone/construct.py 4x4 --mode rich --out /tmp/monotone-4x4.txt
          python3 research/monotone/verify_2d.py /tmp/monotone-4x4.txt
          python3 research/monotone/construct.py 2x2x2 --mode rich --out /tmp/monotone-cube.txt
          python3 research/monotone/verify_box.py /tmp/monotone-cube.txt
          python3 research/monotone/exhaustive.py
          python3 research/monotone/test_rectangle_fold.py
          node test/paper_facts.js
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-pictures texlive-fonts-recommended poppler-utils
      - name: Build and validate paper
        run: |
          set -euo pipefail
          cd paper
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          if grep -E 'undefined references|Citation .* undefined|Reference .* undefined|Overfull \\hbox' main.log; then
            echo 'Paper has unresolved references or overflowing text.' >&2
            exit 1
          fi
          pdfinfo main.pdf
          pdftotext main.pdf /tmp/paper.txt
          grep -q 'Exact monotone extrema' /tmp/paper.txt
          grep -q 'Spawn-robust rectangular fold' /tmp/paper.txt
          grep -q 'Every-opening joint optimum' /tmp/paper.txt
      - name: Publish rebuilt tracked PDF
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/super-mode-speed-corners-doxfcj'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/main.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild paper PDF with monotone extremal results'
            git push origin HEAD:claude/super-mode-speed-corners-doxfcj
          fi
