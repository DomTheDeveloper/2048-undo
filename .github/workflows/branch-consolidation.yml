name: 2048 branch consolidation
on:
  push:
    branches: [gh-pages]
    paths: [.github/workflows/branch-consolidation.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: 2048-branch-consolidation
  cancel-in-progress: false
jobs:
  consolidate:
    if: github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Fresh computational verification of the consolidated source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consolidation"
          git diff --exit-code d2d954fd77218248246db4ea8b30cd2f6333c75b -- js witness lean-kernel lean paper research/monotone research/state-space
          for file in js/*.js; do node --check "$file"; done
          node test/paper_facts.js > "$RUNNER_TEMP/consolidation/paper-facts.log"
          for name in 131072 full-chain max-score; do
            python3 verify/verify2048.py "witness/$name.txt" > "$RUNNER_TEMP/consolidation/$name-python.log"
            node test/replay_engine.js "witness/$name.txt" > "$RUNNER_TEMP/consolidation/$name-engine.log"
          done
          bash research/finish.sh --computations-only > "$RUNNER_TEMP/consolidation/research.log" 2>&1
          bash research/state-space/run.sh --large --output-dir "$RUNNER_TEMP/consolidation/state-space" > "$RUNNER_TEMP/consolidation/state-space.log" 2>&1
          git restore --worktree .
      - name: Preserve canonical links and delete only reviewed integrated branch tips
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 maintenance/consolidate_branches.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: branch-consolidation-${{ github.run_id }}
          path: ${{ runner.temp }}/consolidation/
          if-no-files-found: error
          retention-days: 30
