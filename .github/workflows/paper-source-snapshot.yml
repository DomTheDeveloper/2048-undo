name: Paper source snapshot
on:
  push:
    branches: [proof/lean-131072]
    paths: [".github/workflows/paper-source-snapshot.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive the exact source tree
        run: |
          git rev-parse HEAD > source-commit.txt
          git archive --format=tar.gz --output=paper-proof-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: paper-proof-source
          path: |
            paper-proof-source.tar.gz
            source-commit.txt
          retention-days: 7
